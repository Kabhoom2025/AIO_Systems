<div class="login-page">
  <mat-card class="login-card">
    <div class="brand">
      <mat-icon class="brand-icon">admin_panel_settings</mat-icon>
      <h1>AIO Systems</h1>
      <p>Super Admin Control Plane</p>
    </div>

    <form (ngSubmit)="submit()">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Email</mat-label>
        <input matInput type="email" name="email" [(ngModel)]="email" autocomplete="username" />
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Password</mat-label>
        <input
          matInput
          type="password"
          name="password"
          [(ngModel)]="password"
          autocomplete="current-password"
        />
      </mat-form-field>

      @if (errorMessage()) {
        <p class="error">{{ errorMessage() }}</p>
      }

      <button mat-flat-button color="primary" class="full-width" type="submit" [disabled]="loading()">
        @if (loading()) {
          <mat-spinner diameter="20" />
        } @else {
          Sign In
        }
      </button>
    </form>
  </mat-card>
</div>
