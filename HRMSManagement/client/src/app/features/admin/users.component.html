<p-toast></p-toast>
<p-confirmDialog></p-confirmDialog>

<div class="page-header">
  <h1>Users</h1>
  <button
    *appHasPermission="'users.create'"
    pButton
    type="button"
    icon="pi pi-plus"
    label="Add User"
    (click)="openAddDialog()">
  </button>
</div>

<div class="card">
  <p-table [value]="users" [loading]="loading" dataKey="id" responsiveLayout="scroll">
    <ng-template pTemplate="header">
      <tr>
        <th>Name</th>
        <th>Email</th>
        <th>Role</th>
        <th>Branch</th>
        <th>Employee</th>
        <th>Status</th>
        <th>Last Login</th>
        <th>Actions</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-user>
      <tr>
        <td>{{ user.name }}</td>
        <td>{{ user.email }}</td>
        <td>{{ user.roleName }}</td>
        <td>{{ user.branchName || '-' }}</td>
        <td>{{ user.employeeName || '-' }}</td>
        <td><p-tag [value]="user.isActive ? 'Active' : 'Inactive'" [severity]="user.isActive ? 'success' : 'danger'"></p-tag></td>
        <td>{{ user.lastLoginAt ? (user.lastLoginAt | date: 'dd MMM yyyy, HH:mm') : 'Never' }}</td>
        <td class="actions-cell">
          <button
            *appHasPermission="'users.edit'"
            pButton
            type="button"
            icon="pi pi-pencil"
            class="p-button-text p-button-sm"
            (click)="openEditDialog(user)"
            title="Edit">
          </button>
          <button
            *appHasPermission="'users.edit'"
            pButton
            type="button"
            icon="pi pi-key"
            class="p-button-text p-button-sm"
            (click)="openResetPasswordDialog(user)"
            title="Reset Password">
          </button>
          <button
            *appHasPermission="'users.delete'"
            pButton
            type="button"
            icon="pi pi-ban"
            class="p-button-text p-button-sm p-button-danger"
            [disabled]="!user.isActive"
            (click)="confirmDeactivate(user)"
            title="Deactivate">
          </button>
        </td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="8" class="empty-row">No users found.</td>
      </tr>
    </ng-template>
  </p-table>
</div>

<!-- Add User Dialog -->
<p-dialog header="Add User" [(visible)]="showAddDialog" [modal]="true" [style]="{ width: '480px' }">
  <div class="form-grid">
    <label>Name
      <input pInputText [(ngModel)]="addForm.name" name="addName" />
    </label>
    <label>Email
      <input pInputText type="email" [(ngModel)]="addForm.email" name="addEmail" />
    </label>
    <label>Password
      <input pInputText type="password" [(ngModel)]="addForm.password" name="addPassword" />
    </label>
    <label>Role
      <p-dropdown
        [options]="roles"
        [(ngModel)]="addForm.roleId"
        name="addRoleId"
        optionLabel="name"
        optionValue="id"
        placeholder="Select Role">
      </p-dropdown>
    </label>
    <label>Branch
      <p-dropdown
        [options]="branches"
        [(ngModel)]="addForm.branchId"
        name="addBranchId"
        optionLabel="name"
        optionValue="id"
        placeholder="Select Branch"
        [showClear]="true">
      </p-dropdown>
    </label>
    <label>Employee ID (optional)
      <input pInputText type="number" [(ngModel)]="addForm.employeeId" name="addEmployeeId" />
    </label>
  </div>
  <ng-template pTemplate="footer">
    <button pButton type="button" label="Cancel" class="p-button-text" (click)="showAddDialog = false"></button>
    <button pButton type="button" label="Save" icon="pi pi-check" [loading]="saving" (click)="saveAdd()"></button>
  </ng-template>
</p-dialog>

<!-- Edit User Dialog -->
<p-dialog header="Edit User" [(visible)]="showEditDialog" [modal]="true" [style]="{ width: '480px' }">
  <div class="form-grid">
    <label>Name
      <input pInputText [(ngModel)]="editForm.name" name="editName" />
    </label>
    <label>Role
      <p-dropdown
        [options]="roles"
        [(ngModel)]="editForm.roleId"
        name="editRoleId"
        optionLabel="name"
        optionValue="id"
        placeholder="Select Role">
      </p-dropdown>
    </label>
    <label>Branch
      <p-dropdown
        [options]="branches"
        [(ngModel)]="editForm.branchId"
        name="editBranchId"
        optionLabel="name"
        optionValue="id"
        placeholder="Select Branch"
        [showClear]="true">
      </p-dropdown>
    </label>
    <label class="checkbox-row">
      <input type="checkbox" [(ngModel)]="editForm.isActive" name="editIsActive" /> Active
    </label>
  </div>
  <ng-template pTemplate="footer">
    <button pButton type="button" label="Cancel" class="p-button-text" (click)="showEditDialog = false"></button>
    <button pButton type="button" label="Save" icon="pi pi-check" [loading]="saving" (click)="saveEdit()"></button>
  </ng-template>
</p-dialog>

<!-- Reset Password Dialog -->
<p-dialog header="Reset Password" [(visible)]="showResetPasswordDialog" [modal]="true" [style]="{ width: '380px' }">
  <div class="form-grid">
    <label>New Password
      <input pInputText type="password" [(ngModel)]="resetPasswordForm.newPassword" name="newPassword" />
    </label>
  </div>
  <ng-template pTemplate="footer">
    <button pButton type="button" label="Cancel" class="p-button-text" (click)="showResetPasswordDialog = false"></button>
    <button pButton type="button" label="Reset" icon="pi pi-check" [loading]="saving" (click)="saveResetPassword()"></button>
  </ng-template>
</p-dialog>
