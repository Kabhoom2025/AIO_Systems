<div class="patient-auth-page">
  <div class="brand-panel">
    <div class="brand-mark">
      <svg width="40" height="40" viewBox="0 0 34 34" fill="none">
        <circle cx="17" cy="17" r="16" fill="#0E4D42"/>
        <path d="M17 8 L17 26 M8 17 L26 17" stroke="#F5F7F3" stroke-width="3.4" stroke-linecap="round"/>
        <circle cx="17" cy="17" r="16" stroke="#E98A2E" stroke-width="1.4"/>
      </svg>
      <span>Amara Hospitals</span>
    </div>
    <h1>Almost there.</h1>
    <p>We've sent a one-time code to verify it's really you.</p>
  </div>

  <div class="form-panel">
    <div class="auth-card">
      <h2>Enter OTP</h2>
      <p class="sub">Sent to +91 {{ phone }}</p>

      @if (devOtp) {
        <div class="dev-banner">
          No SMS gateway is configured in this dev environment, so here's your code directly:
          <br/><strong>{{ devOtp }}</strong>
        </div>
      }

      <input class="otp-input" type="text" inputmode="numeric" maxlength="6" placeholder="••••••"
             [(ngModel)]="code" (keyup.enter)="verify()" />

      @if (error()) {
        <div class="error-msg">{{ error() }}</div>
      }

      <button class="btn-primary" [disabled]="loading()" (click)="verify()">
        {{ loading() ? 'Verifying…' : 'Verify & Continue' }}
      </button>
      <button class="btn-link" (click)="resend()">Change number / resend OTP</button>
    </div>
  </div>
</div>
