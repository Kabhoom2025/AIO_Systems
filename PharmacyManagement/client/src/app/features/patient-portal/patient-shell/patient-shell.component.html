<div class="patient-shell">
  <header>
    <a class="brand-mark" routerLink="/patient/home">
      <svg width="30" height="30" viewBox="0 0 34 34" fill="none">
        <circle cx="17" cy="17" r="16" fill="#0E4D42"/>
        <path d="M17 8 L17 26 M8 17 L26 17" stroke="#F5F7F3" stroke-width="3.4" stroke-linecap="round"/>
        <circle cx="17" cy="17" r="16" stroke="#E98A2E" stroke-width="1.4"/>
      </svg>
      <span>Amara Hospitals</span>
    </a>

    <nav>
      <a routerLink="/patient/home" routerLinkActive="active">Home</a>
      <a routerLink="/patient/doctors" routerLinkActive="active">Doctors</a>
      <a routerLink="/patient/store" routerLinkActive="active">Store</a>
      <a routerLink="/patient/locations" routerLinkActive="active">Locations</a>
    </nav>

    <a class="cart-icon" routerLink="/patient/cart" routerLinkActive="active" aria-label="Cart">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
        <path d="M3 4h2l2.4 12.2a2 2 0 0 0 2 1.6h7.6a2 2 0 0 0 2-1.6L21 8H6" stroke="#12231F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="10" cy="21" r="1.4" fill="#12231F"/>
        <circle cx="17" cy="21" r="1.4" fill="#12231F"/>
      </svg>
      @if (cart.count() > 0) { <span class="cart-badge">{{ cart.count() }}</span> }
    </a>

    <div class="user-menu">
      <button class="user-btn" (click)="toggleMenu()">
        <span class="avatar">{{ (user?.name || user?.phone || '?').charAt(0).toUpperCase() }}</span>
        <span class="phone">+91 {{ user?.phone }}</span>
      </button>
      @if (menuOpen()) {
        <div class="dropdown">
          <div class="dropdown-info">{{ user?.name || 'Guest Patient' }}<br/><span>{{ user?.organizationName }}</span></div>
          <a routerLink="/patient/profile" (click)="toggleMenu()">My Profile</a>
          <a routerLink="/patient/appointments" (click)="toggleMenu()">My Appointments</a>
          <a routerLink="/patient/orders" (click)="toggleMenu()">My Orders</a>
          <button (click)="logout()">Log out</button>
        </div>
      }
    </div>
  </header>

  <main>
    <router-outlet />
  </main>
</div>
