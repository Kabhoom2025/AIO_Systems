<p-toast></p-toast>
<p-confirmDialog></p-confirmDialog>

<div class="page-header">
  <h1>Stores</h1>
  <button *appHasPermission="'retail.create'" pButton type="button" icon="pi pi-plus" label="Add Store"
          (click)="openNew()"></button>
</div>

<div class="card">
  <p-table [value]="stores" [loading]="loading" dataKey="id" responsiveLayout="scroll">
    <ng-template pTemplate="header">
      <tr>
        <th>Code</th>
        <th>Name</th>
        <th>Branch</th>
        <th>Warehouse</th>
        <th>Active</th>
        <th style="width: 10rem">Actions</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-s>
      <tr>
        <td><code class="code-badge">{{ s.code }}</code></td>
        <td class="font-semibold">{{ s.name }}</td>
        <td>{{ s.branchName }}</td>
        <td>{{ s.warehouseName }}</td>
        <td>
          <p-tag [severity]="s.isActive ? 'success' : 'danger'" [value]="s.isActive ? 'Active' : 'Inactive'"></p-tag>
        </td>
        <td class="actions-cell">
          <button *appHasPermission="'retail.edit'" pButton type="button" icon="pi pi-pencil"
                  class="p-button-text p-button-sm" (click)="openEdit(s)"></button>
          <button *appHasPermission="'retail.delete'" pButton type="button" icon="pi pi-trash"
                  class="p-button-text p-button-sm p-button-danger" (click)="delete(s)"></button>
        </td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
      <tr><td colspan="6" class="empty-cell">No stores yet.</td></tr>
    </ng-template>
  </p-table>
</div>

<p-dialog header="{{ editing ? 'Edit' : 'Add' }} Store" [(visible)]="showDialog" [modal]="true" [style]="{ width: '30rem' }">
  <div class="form-grid">
    <label>
      <span>Branch</span>
      <p-dropdown [options]="branches" [(ngModel)]="form.branchId" optionLabel="name" optionValue="id"
                  placeholder="Select branch" [style]="{ width: '100%' }"></p-dropdown>
    </label>
    <label>
      <span>Warehouse</span>
      <p-dropdown [options]="warehouses" [(ngModel)]="form.warehouseId" optionLabel="name" optionValue="id"
                  placeholder="Select warehouse" [style]="{ width: '100%' }"></p-dropdown>
    </label>
    <label>
      <span>Code</span>
      <input pInputText [(ngModel)]="form.code" [disabled]="!!editing" placeholder="e.g. STORE-BLR" />
    </label>
    <label>
      <span>Name</span>
      <input pInputText [(ngModel)]="form.name" />
    </label>
    <label>
      <span>Address</span>
      <input pInputText [(ngModel)]="form.address" />
    </label>
    <label class="checkbox-row">
      <p-checkbox [(ngModel)]="form.isActive" [binary]="true"></p-checkbox>
      <span>Active</span>
    </label>
  </div>
  <ng-template pTemplate="footer">
    <button pButton type="button" label="Cancel" class="p-button-text" (click)="showDialog = false"></button>
    <button pButton type="button" label="Save" [loading]="saving" (click)="save()"></button>
  </ng-template>
</p-dialog>
