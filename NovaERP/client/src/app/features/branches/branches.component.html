<p-toast></p-toast>
<p-confirmDialog></p-confirmDialog>

<div class="page-header">
  <h1>Branches</h1>
  <button *appHasPermission="'branches.create'" pButton type="button" icon="pi pi-plus" label="Add Branch"
          (click)="openNew()"></button>
</div>

<div class="card">
  <p-table [value]="branches" [loading]="loading" dataKey="id" responsiveLayout="scroll">
    <ng-template pTemplate="header">
      <tr>
        <th>Name</th>
        <th>Code</th>
        <th>City</th>
        <th>Country</th>
        <th>Phone</th>
        <th>Head Office</th>
        <th>Status</th>
        <th style="width: 10rem">Actions</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-b>
      <tr>
        <td class="font-semibold">{{ b.name }}</td>
        <td><code class="code-badge">{{ b.code }}</code></td>
        <td>{{ b.city || '-' }}</td>
        <td>{{ b.country || '-' }}</td>
        <td>{{ b.phone || '-' }}</td>
        <td>
          <i class="pi" [ngClass]="b.isHeadOffice ? 'pi-check-circle text-success' : 'pi-minus text-muted'"></i>
        </td>
        <td>
          <p-tag [value]="b.isActive ? 'Active' : 'Inactive'" [severity]="b.isActive ? 'success' : 'danger'"></p-tag>
        </td>
        <td class="actions-cell">
          <button *appHasPermission="'branches.edit'" pButton type="button" icon="pi pi-pencil"
                  class="p-button-text p-button-sm" (click)="openEdit(b)"></button>
          <button *appHasPermission="'branches.delete'" pButton type="button" icon="pi pi-trash"
                  class="p-button-text p-button-sm p-button-danger" (click)="delete(b)"></button>
        </td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
      <tr><td colspan="8" class="empty-cell">No branches configured.</td></tr>
    </ng-template>
  </p-table>
</div>

<p-dialog header="{{ editing ? 'Edit' : 'Add' }} Branch" [(visible)]="showDialog" [modal]="true" [style]="{ width: '34rem' }">
  <div class="form-grid">
    <label>
      <span>Branch Name</span>
      <input pInputText [(ngModel)]="form.name" />
    </label>
    <label>
      <span>Branch Code</span>
      <input pInputText [(ngModel)]="form.code" />
    </label>
    <label>
      <span>Phone Number</span>
      <input pInputText [(ngModel)]="form.phone" />
    </label>
    <label>
      <span>Email Address</span>
      <input pInputText type="email" [(ngModel)]="form.email" />
    </label>
    <label>
      <span>Timezone</span>
      <input pInputText [(ngModel)]="form.timezone" />
    </label>
    <label class="checkbox-row mt-4">
      <input type="checkbox" [(ngModel)]="form.isHeadOffice" />
      <span>Is Head Office</span>
    </label>
    <label class="col-span-2">
      <span>Street Address</span>
      <input pInputText [(ngModel)]="form.address" />
    </label>
    <label>
      <span>City</span>
      <input pInputText [(ngModel)]="form.city" />
    </label>
    <label>
      <span>State</span>
      <input pInputText [(ngModel)]="form.state" />
    </label>
    <label>
      <span>Country</span>
      <input pInputText [(ngModel)]="form.country" />
    </label>
    @if (editing) {
      <label class="checkbox-row col-span-2 mt-2">
        <input type="checkbox" [(ngModel)]="form.isActive" />
        <span>Active</span>
      </label>
    }
  </div>
  <ng-template pTemplate="footer">
    <button pButton type="button" label="Cancel" class="p-button-text" (click)="showDialog = false"></button>
    <button pButton type="button" label="Save" [loading]="saving" (click)="save()"></button>
  </ng-template>
</p-dialog>
