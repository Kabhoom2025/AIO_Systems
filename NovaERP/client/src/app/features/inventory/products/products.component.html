<p-toast></p-toast>
<p-confirmDialog></p-confirmDialog>

<div class="page-header">
  <h1>Products</h1>
  <button *appHasPermission="'inventory.create'" pButton type="button" icon="pi pi-plus" label="Add Product"
          (click)="openNew()"></button>
</div>

<div class="card">
  <p-table [value]="products" [loading]="loading" dataKey="id" responsiveLayout="scroll">
    <ng-template pTemplate="header">
      <tr>
        <th>SKU</th>
        <th>Name</th>
        <th>UOM</th>
        <th>Weight (kg)</th>
        <th>On Hand</th>
        <th>Active</th>
        <th style="width: 10rem">Actions</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-p>
      <tr>
        <td><code class="code-badge">{{ p.sku }}</code></td>
        <td class="font-semibold">{{ p.name }}</td>
        <td>{{ p.unitOfMeasure }}</td>
        <td>{{ p.weightKg != null ? (p.weightKg | number: '1.0-3') : '—' }}</td>
        <td>{{ p.onHandQuantity | number: '1.0-4' }}</td>
        <td>
          <p-tag [severity]="p.isActive ? 'success' : 'danger'" [value]="p.isActive ? 'Active' : 'Inactive'"></p-tag>
        </td>
        <td class="actions-cell">
          <button *appHasPermission="'inventory.edit'" pButton type="button" icon="pi pi-pencil"
                  class="p-button-text p-button-sm" (click)="openEdit(p)"></button>
          <button *appHasPermission="'inventory.delete'" pButton type="button" icon="pi pi-trash"
                  class="p-button-text p-button-sm p-button-danger" (click)="delete(p)"></button>
        </td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
      <tr><td colspan="7" class="empty-cell">No products yet.</td></tr>
    </ng-template>
  </p-table>
</div>

<p-dialog header="{{ editing ? 'Edit' : 'Add' }} Product" [(visible)]="showDialog" [modal]="true" [style]="{ width: '30rem' }">
  <div class="form-grid">
    <label>
      <span>SKU</span>
      <input pInputText [(ngModel)]="form.sku" [disabled]="!!editing" placeholder="e.g. STEEL-2MM" />
    </label>
    <label>
      <span>Name</span>
      <input pInputText [(ngModel)]="form.name" />
    </label>
    <label>
      <span>Description</span>
      <input pInputText [(ngModel)]="form.description" />
    </label>
    <label>
      <span>Unit of Measure</span>
      <input pInputText [(ngModel)]="form.unitOfMeasure" placeholder="e.g. EA, KG" />
    </label>
    <label>
      <span>Unit Cost</span>
      <p-inputNumber [(ngModel)]="form.unitCost" mode="decimal" [minFractionDigits]="2" [style]="{ width: '100%' }"></p-inputNumber>
    </label>
    <label>
      <span>Weight (kg, per unit)</span>
      <p-inputNumber [(ngModel)]="form.weightKg" mode="decimal" [minFractionDigits]="0" [maxFractionDigits]="3"
                     [style]="{ width: '100%' }"></p-inputNumber>
    </label>
    <label class="checkbox-row">
      <p-checkbox [(ngModel)]="form.isActive" [binary]="true"></p-checkbox>
      <span>Active</span>
    </label>
  </div>
  <ng-template pTemplate="footer">
    <button pButton type="button" label="Cancel" class="p-button-text" (click)="showDialog = false"></button>
    <button pButton type="button" label="Save" [loading]="saving" (click)="save()"></button>
  </ng-template>
</p-dialog>
