<p-toast></p-toast>
<p-confirmDialog></p-confirmDialog>

<div class="page-header">
  <h1>Projects</h1>
  <button *appHasPermission="'projects.create'" pButton type="button" icon="pi pi-plus" label="Add Project"
          (click)="openNew()"></button>
</div>

<div class="card">
  <p-table [value]="projects" [loading]="loading" dataKey="id" responsiveLayout="scroll">
    <ng-template pTemplate="header">
      <tr>
        <th>Code</th>
        <th>Name</th>
        <th>Manager</th>
        <th>Start Date</th>
        <th>Tasks</th>
        <th>Status</th>
        <th style="width: 10rem">Actions</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-p>
      <tr>
        <td><code class="code-badge">{{ p.code }}</code></td>
        <td class="font-semibold">{{ p.name }}</td>
        <td>{{ p.managerName }}</td>
        <td>{{ p.startDate | date: 'mediumDate' }}</td>
        <td>{{ p.completedTaskCount }} / {{ p.taskCount }}</td>
        <td><p-tag [severity]="statusSeverity(p.status)" [value]="p.status"></p-tag></td>
        <td class="actions-cell">
          <button *appHasPermission="'projects.edit'" pButton type="button" icon="pi pi-pencil"
                  class="p-button-text p-button-sm" (click)="openEdit(p)"></button>
          <button *appHasPermission="'projects.delete'" pButton type="button" icon="pi pi-trash"
                  class="p-button-text p-button-sm p-button-danger" (click)="delete(p)"></button>
        </td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
      <tr><td colspan="7" class="empty-cell">No projects yet.</td></tr>
    </ng-template>
  </p-table>
</div>

<p-dialog header="{{ editing ? 'Edit' : 'Add' }} Project" [(visible)]="showDialog" [modal]="true" [style]="{ width: '32rem' }">
  <div class="form-grid">
    <label>
      <span>Code</span>
      <input pInputText [(ngModel)]="form.code" [disabled]="!!editing" placeholder="e.g. PROJ-ERP" />
    </label>
    <label>
      <span>Name</span>
      <input pInputText [(ngModel)]="form.name" />
    </label>
    <label>
      <span>Manager</span>
      <p-dropdown [options]="employees" [(ngModel)]="form.managerId" optionValue="id"
                  placeholder="Select manager" [style]="{ width: '100%' }">
        <ng-template let-e pTemplate="item">{{ e.firstName }} {{ e.lastName }}</ng-template>
        <ng-template let-e pTemplate="selectedItem">{{ e.firstName }} {{ e.lastName }}</ng-template>
      </p-dropdown>
    </label>
    @if (editing) {
      <label>
        <span>Status</span>
        <p-dropdown [options]="statuses" [(ngModel)]="form.status" [style]="{ width: '100%' }"></p-dropdown>
      </label>
    }
    <label>
      <span>Start Date</span>
      <p-calendar [(ngModel)]="form.startDate" dateFormat="dd/mm/yy" [showIcon]="true" [style]="{ width: '100%' }"></p-calendar>
    </label>
    <label>
      <span>End Date</span>
      <p-calendar [(ngModel)]="form.endDate" dateFormat="dd/mm/yy" [showIcon]="true" [style]="{ width: '100%' }"></p-calendar>
    </label>
    <label>
      <span>Budget</span>
      <p-inputNumber [(ngModel)]="form.budget" mode="decimal" [minFractionDigits]="0" [maxFractionDigits]="2" [style]="{ width: '100%' }"></p-inputNumber>
    </label>
    <label>
      <span>Description</span>
      <input pInputText [(ngModel)]="form.description" />
    </label>
  </div>
  <ng-template pTemplate="footer">
    <button pButton type="button" label="Cancel" class="p-button-text" (click)="showDialog = false"></button>
    <button pButton type="button" label="Save" [loading]="saving" (click)="save()"></button>
  </ng-template>
</p-dialog>
