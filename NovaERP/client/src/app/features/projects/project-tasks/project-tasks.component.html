<p-toast></p-toast>
<p-confirmDialog></p-confirmDialog>

<div class="page-header">
  <h1>Project Tasks</h1>
  <button *appHasPermission="'projects.create'" pButton type="button" icon="pi pi-plus" label="Add Task"
          (click)="openNew()"></button>
</div>

<div class="card">
  <p-table [value]="tasks" [loading]="loading" dataKey="id" responsiveLayout="scroll">
    <ng-template pTemplate="header">
      <tr>
        <th>Title</th>
        <th>Project</th>
        <th>Assigned To</th>
        <th>Priority</th>
        <th>Due Date</th>
        <th>Status</th>
        <th style="width: 10rem">Actions</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-t>
      <tr>
        <td class="font-semibold">{{ t.title }}</td>
        <td>{{ t.projectName }}</td>
        <td>{{ t.assignedToName ?? '—' }}</td>
        <td><p-tag [severity]="prioritySeverity(t.priority)" [value]="t.priority"></p-tag></td>
        <td>{{ t.dueDate ? (t.dueDate | date: 'mediumDate') : '—' }}</td>
        <td><p-tag [severity]="statusSeverity(t.status)" [value]="t.status"></p-tag></td>
        <td class="actions-cell">
          <button *appHasPermission="'projects.edit'" pButton type="button" icon="pi pi-pencil"
                  class="p-button-text p-button-sm" (click)="openEdit(t)"></button>
          <button *appHasPermission="'projects.delete'" pButton type="button" icon="pi pi-trash"
                  class="p-button-text p-button-sm p-button-danger" (click)="delete(t)"></button>
        </td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
      <tr><td colspan="7" class="empty-cell">No tasks yet.</td></tr>
    </ng-template>
  </p-table>
</div>

<p-dialog header="{{ editing ? 'Edit' : 'Add' }} Task" [(visible)]="showDialog" [modal]="true" [style]="{ width: '32rem' }">
  <div class="form-grid">
    <label>
      <span>Project</span>
      <p-dropdown [options]="projects" [(ngModel)]="form.projectId" optionLabel="name" optionValue="id"
                  placeholder="Select project" [disabled]="!!editing" [style]="{ width: '100%' }"></p-dropdown>
    </label>
    <label>
      <span>Assigned To</span>
      <p-dropdown [options]="employees" [(ngModel)]="form.assignedToId" optionValue="id"
                  placeholder="Unassigned" [showClear]="true" [style]="{ width: '100%' }">
        <ng-template let-e pTemplate="item">{{ e.firstName }} {{ e.lastName }}</ng-template>
        <ng-template let-e pTemplate="selectedItem">{{ e.firstName }} {{ e.lastName }}</ng-template>
      </p-dropdown>
    </label>
    <label>
      <span>Title</span>
      <input pInputText [(ngModel)]="form.title" />
    </label>
    <label>
      <span>Priority</span>
      <p-dropdown [options]="priorities" [(ngModel)]="form.priority" [style]="{ width: '100%' }"></p-dropdown>
    </label>
    <label>
      <span>Status</span>
      <p-dropdown [options]="statuses" [(ngModel)]="form.status" [style]="{ width: '100%' }"></p-dropdown>
    </label>
    <label>
      <span>Start Date</span>
      <p-calendar [(ngModel)]="form.startDate" dateFormat="dd/mm/yy" [showIcon]="true" [style]="{ width: '100%' }"></p-calendar>
    </label>
    <label>
      <span>Due Date</span>
      <p-calendar [(ngModel)]="form.dueDate" dateFormat="dd/mm/yy" [showIcon]="true" [style]="{ width: '100%' }"></p-calendar>
    </label>
    <label>
      <span>Description</span>
      <input pInputText [(ngModel)]="form.description" />
    </label>
  </div>
  <ng-template pTemplate="footer">
    <button pButton type="button" label="Cancel" class="p-button-text" (click)="showDialog = false"></button>
    <button pButton type="button" label="Save" [loading]="saving" (click)="save()"></button>
  </ng-template>
</p-dialog>
