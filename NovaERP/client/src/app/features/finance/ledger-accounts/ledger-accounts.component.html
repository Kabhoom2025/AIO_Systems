<p-toast></p-toast>
<p-confirmDialog></p-confirmDialog>

<div class="page-header">
  <h1>Ledger Accounts</h1>
  <button *appHasPermission="'finance.create'" pButton type="button" icon="pi pi-plus" label="Add Ledger Account"
          (click)="openNew()"></button>
</div>

<div class="card">
  <p-table [value]="accounts" [loading]="loading" dataKey="id" responsiveLayout="scroll">
    <ng-template pTemplate="header">
      <tr>
        <th>Code</th>
        <th>Name</th>
        <th>Type</th>
        <th>Balance</th>
        <th>Active</th>
        <th style="width: 10rem">Actions</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-a>
      <tr>
        <td><code class="code-badge">{{ a.code }}</code></td>
        <td class="font-semibold">{{ a.name }}</td>
        <td><p-tag [severity]="typeSeverity(a.type)" [value]="a.type"></p-tag></td>
        <td class="font-semibold">{{ a.balance | number: '1.2-2' }}</td>
        <td>
          <p-tag [severity]="a.isActive ? 'success' : 'danger'" [value]="a.isActive ? 'Active' : 'Inactive'"></p-tag>
        </td>
        <td class="actions-cell">
          <button *appHasPermission="'finance.edit'" pButton type="button" icon="pi pi-pencil"
                  class="p-button-text p-button-sm" (click)="openEdit(a)"></button>
          <button *appHasPermission="'finance.delete'" pButton type="button" icon="pi pi-trash"
                  class="p-button-text p-button-sm p-button-danger" (click)="delete(a)"></button>
        </td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
      <tr><td colspan="6" class="empty-cell">No ledger accounts yet.</td></tr>
    </ng-template>
  </p-table>
</div>

<p-dialog header="{{ editing ? 'Edit' : 'Add' }} Ledger Account" [(visible)]="showDialog" [modal]="true" [style]="{ width: '30rem' }">
  <div class="form-grid">
    <label>
      <span>Code</span>
      <input pInputText [(ngModel)]="form.code" [disabled]="!!editing" placeholder="e.g. 1000" />
    </label>
    <label>
      <span>Name</span>
      <input pInputText [(ngModel)]="form.name" />
    </label>
    <label>
      <span>Type</span>
      <p-dropdown [options]="accountTypes" [(ngModel)]="form.type" [style]="{ width: '100%' }"></p-dropdown>
    </label>
    <label class="checkbox-row">
      <p-checkbox [(ngModel)]="form.isActive" [binary]="true"></p-checkbox>
      <span>Active</span>
    </label>
  </div>
  <ng-template pTemplate="footer">
    <button pButton type="button" label="Cancel" class="p-button-text" (click)="showDialog = false"></button>
    <button pButton type="button" label="Save" [loading]="saving" (click)="save()"></button>
  </ng-template>
</p-dialog>
