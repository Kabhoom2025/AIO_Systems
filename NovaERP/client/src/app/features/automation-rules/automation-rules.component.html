<p-toast></p-toast>
<p-confirmDialog></p-confirmDialog>

<div class="page-header">
  <h1>Automation Rules</h1>
  <button *appHasPermission="'automation.create'" pButton type="button" icon="pi pi-plus" label="Add Rule"
          (click)="openNew()"></button>
</div>

<div class="card">
  <p-table [value]="rules" [loading]="loading" dataKey="id" responsiveLayout="scroll">
    <ng-template pTemplate="header">
      <tr>
        <th>Name</th>
        <th>Trigger Event</th>
        <th>Action</th>
        <th>Notify Role</th>
        <th>Enabled</th>
        <th style="width: 10rem">Actions</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-r>
      <tr>
        <td class="font-semibold">{{ r.name }}</td>
        <td><code class="code-badge">{{ r.triggerEvent }}</code></td>
        <td>{{ r.actionType }}</td>
        <td>{{ r.notifyRoleName ?? '—' }}</td>
        <td>
          <p-tag [severity]="r.isEnabled ? 'success' : 'danger'" [value]="r.isEnabled ? 'Enabled' : 'Disabled'"></p-tag>
        </td>
        <td class="actions-cell">
          <button *appHasPermission="'automation.edit'" pButton type="button" icon="pi pi-pencil"
                  class="p-button-text p-button-sm" (click)="openEdit(r)"></button>
          <button *appHasPermission="'automation.delete'" pButton type="button" icon="pi pi-trash"
                  class="p-button-text p-button-sm p-button-danger" (click)="delete(r)"></button>
        </td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
      <tr><td colspan="6" class="empty-cell">No automation rules configured.</td></tr>
    </ng-template>
  </p-table>
</div>

<p-dialog header="{{ editing ? 'Edit' : 'Add' }} Automation Rule" [(visible)]="showDialog" [modal]="true"
          [style]="{ width: '32rem' }">
  <div class="form-grid">
    <label>
      <span>Name</span>
      <input pInputText [(ngModel)]="form.name" />
    </label>
    <label>
      <span>Trigger Event</span>
      <p-dropdown [options]="triggerEvents" [(ngModel)]="form.triggerEvent" placeholder="Select Trigger Event"
                  [style]="{ width: '100%' }"></p-dropdown>
    </label>
    <label>
      <span>Action Type</span>
      <p-dropdown [options]="actionTypes" [(ngModel)]="form.actionType" [style]="{ width: '100%' }"></p-dropdown>
    </label>
    <label>
      <span>Notify Role</span>
      <p-dropdown [options]="roles" [(ngModel)]="form.notifyRoleId" optionLabel="name" optionValue="id"
                  placeholder="Optional" [showClear]="true" [style]="{ width: '100%' }"></p-dropdown>
    </label>
    <label class="full-width">
      <span>Notify Message Template</span>
      <textarea pInputTextarea rows="3" [(ngModel)]="form.notifyMessageTemplate" style="width: 100%"></textarea>
    </label>
    <label class="checkbox-row">
      <p-checkbox [(ngModel)]="form.isEnabled" [binary]="true"></p-checkbox>
      <span>Enabled</span>
    </label>
  </div>
  <ng-template pTemplate="footer">
    <button pButton type="button" label="Cancel" class="p-button-text" (click)="showDialog = false"></button>
    <button pButton type="button" label="Save" [loading]="saving" (click)="save()"></button>
  </ng-template>
</p-dialog>
