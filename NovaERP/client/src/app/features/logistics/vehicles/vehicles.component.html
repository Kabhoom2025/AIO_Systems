<p-toast></p-toast>
<p-confirmDialog></p-confirmDialog>

<div class="page-header">
  <h1>Vehicles</h1>
  <button *appHasPermission="'logistics.create'" pButton type="button" icon="pi pi-plus" label="Add New"
          (click)="openNew()"></button>
</div>

<div class="card">
  <p-table [value]="vehicles" [loading]="loading" dataKey="id" responsiveLayout="scroll">
    <ng-template pTemplate="header">
      <tr>
        <th>Code</th>
        <th>Name</th>
        <th>Model</th>
        <th>Capacity</th>
        <th>Status</th>
        <th>Current Location</th>
        <th>Active</th>
        <th style="width: 10rem">Actions</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-v>
      <tr>
        <td><code class="code-badge">{{ v.code }}</code></td>
        <td class="font-semibold">{{ v.name }}</td>
        <td>{{ v.model || '—' }}</td>
        <td>{{ v.capacityKg | number: '1.0-0' }} kg</td>
        <td><p-tag [severity]="statusSeverity(v.status)" [value]="v.status"></p-tag></td>
        <td>{{ v.currentWarehouseName || '—' }}</td>
        <td>
          <p-tag [severity]="v.isActive ? 'success' : 'danger'" [value]="v.isActive ? 'Active' : 'Inactive'"></p-tag>
        </td>
        <td class="actions-cell">
          <button *appHasPermission="'logistics.edit'" pButton type="button" icon="pi pi-pencil"
                  class="p-button-text p-button-sm" (click)="openEdit(v)"></button>
          <button *appHasPermission="'logistics.delete'" pButton type="button" icon="pi pi-trash"
                  class="p-button-text p-button-sm p-button-danger" (click)="delete(v)"></button>
        </td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
      <tr><td colspan="8" class="empty-cell">No vehicles yet.</td></tr>
    </ng-template>
  </p-table>
</div>

<p-dialog header="{{ editing ? 'Edit' : 'Add' }} Vehicle" [(visible)]="showDialog" [modal]="true" [style]="{ width: '30rem' }">
  <div class="form-grid">
    <label>
      <span>Code</span>
      <input pInputText [(ngModel)]="form.code" [disabled]="!!editing" placeholder="e.g. TRUCK-102" />
    </label>
    <label>
      <span>Name</span>
      <input pInputText [(ngModel)]="form.name" placeholder="e.g. Kenworth T680" />
    </label>
    <label>
      <span>Model</span>
      <input pInputText [(ngModel)]="form.model" />
    </label>
    <label>
      <span>Capacity (kg)</span>
      <p-inputNumber [(ngModel)]="form.capacityKg" mode="decimal" [minFractionDigits]="0" [style]="{ width: '100%' }"></p-inputNumber>
    </label>
    <label>
      <span>Current Location</span>
      <p-dropdown [options]="warehouses" [(ngModel)]="form.currentWarehouseId" optionLabel="name" optionValue="id"
                  placeholder="Select warehouse" [showClear]="true" [style]="{ width: '100%' }"></p-dropdown>
    </label>
    <label class="checkbox-row">
      <p-checkbox [(ngModel)]="form.isActive" [binary]="true"></p-checkbox>
      <span>Active</span>
    </label>
  </div>
  <ng-template pTemplate="footer">
    <button pButton type="button" label="Cancel" class="p-button-text" (click)="showDialog = false"></button>
    <button pButton type="button" label="Save" [loading]="saving" (click)="save()"></button>
  </ng-template>
</p-dialog>
