<div class="login-page">
  <p-card class="login-card">
    <div class="brand">
      <h1>NovaERP</h1>
      <p>Cloudleap Enterprise Resource Planning</p>
    </div>

    <form (ngSubmit)="submit()" #form="ngForm">
      <div class="field">
        <label for="email">Email</label>
        <input pInputText id="email" name="email" type="email" [(ngModel)]="email" required class="w-full" autocomplete="username" />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <p-password id="password" name="password" [(ngModel)]="password" [feedback]="false" [toggleMask]="true" styleClass="w-full" inputStyleClass="w-full" required autocomplete="current-password"></p-password>
      </div>
      <p-button type="submit" label="Sign In" [loading]="loading" [disabled]="form.invalid" styleClass="w-full"></p-button>
    </form>
  </p-card>
</div>
