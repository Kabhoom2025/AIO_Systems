<p-toast></p-toast>

<div class="page-header">
  <h1>Currencies</h1>
  <button *appHasPermission="'settings.create'" pButton type="button" icon="pi pi-plus" label="Add Currency"
          (click)="openNew()"></button>
</div>

<div class="card">
  <p-table [value]="currencies" [loading]="loading" dataKey="id" responsiveLayout="scroll">
    <ng-template pTemplate="header">
      <tr>
        <th>Code</th>
        <th>Name</th>
        <th>Symbol</th>
        <th>Decimal Places</th>
        <th>Status</th>
        <th style="width: 6rem">Actions</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-c>
      <tr>
        <td><code class="code-badge">{{ c.code }}</code></td>
        <td class="font-semibold">{{ c.name }}</td>
        <td>{{ c.symbol }}</td>
        <td>{{ c.decimalPlaces }}</td>
        <td>
          <p-tag [value]="c.isActive ? 'Active' : 'Inactive'" [severity]="c.isActive ? 'success' : 'danger'"></p-tag>
        </td>
        <td class="actions-cell">
          <button *appHasPermission="'settings.edit'" pButton type="button" icon="pi pi-pencil"
                  class="p-button-text p-button-sm" (click)="openEdit(c)"></button>
        </td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
      <tr><td colspan="6" class="empty-cell">No currencies configured.</td></tr>
    </ng-template>
  </p-table>
</div>

<p-dialog header="{{ editing ? 'Edit' : 'Add' }} Currency" [(visible)]="showDialog" [modal]="true" [style]="{ width: '28rem' }">
  <div class="form-grid">
    <label>
      <span>Code</span>
      <input pInputText [(ngModel)]="form.code" [disabled]="!!editing" />
    </label>
    <label>
      <span>Name</span>
      <input pInputText [(ngModel)]="form.name" />
    </label>
    <label>
      <span>Symbol</span>
      <input pInputText [(ngModel)]="form.symbol" />
    </label>
    <label>
      <span>Decimal Places</span>
      <p-inputNumber [(ngModel)]="form.decimalPlaces" [min]="0" [max]="4" [style]="{ width: '100%' }"></p-inputNumber>
    </label>
    @if (editing) {
      <label class="checkbox-row col-span-2 mt-2">
        <input type="checkbox" [(ngModel)]="form.isActive" />
        <span>Active</span>
      </label>
    }
  </div>
  <ng-template pTemplate="footer">
    <button pButton type="button" label="Cancel" class="p-button-text" (click)="showDialog = false"></button>
    <button pButton type="button" label="Save" [loading]="saving" (click)="save()"></button>
  </ng-template>
</p-dialog>
