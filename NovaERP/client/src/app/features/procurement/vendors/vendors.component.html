<p-toast></p-toast>
<p-confirmDialog></p-confirmDialog>

<div class="page-header">
  <h1>Vendors</h1>
  <button *appHasPermission="'procurement.create'" pButton type="button" icon="pi pi-plus" label="Add Vendor"
          (click)="openNew()"></button>
</div>

<div class="card">
  <p-table [value]="vendors" [loading]="loading" dataKey="id" responsiveLayout="scroll">
    <ng-template pTemplate="header">
      <tr>
        <th>Name</th>
        <th>Category</th>
        <th>Contact Email</th>
        <th>Active</th>
        <th>Owner</th>
        <th style="width: 10rem">Actions</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-v>
      <tr>
        <td class="font-semibold">{{ v.name }}</td>
        <td>{{ v.category || '—' }}</td>
        <td>{{ v.contactEmail || '—' }}</td>
        <td>
          <p-tag [severity]="v.isActive ? 'success' : 'danger'" [value]="v.isActive ? 'Active' : 'Inactive'"></p-tag>
        </td>
        <td>{{ v.ownerName }}</td>
        <td class="actions-cell">
          <button *appHasPermission="'procurement.edit'" pButton type="button" icon="pi pi-pencil"
                  class="p-button-text p-button-sm" (click)="openEdit(v)"></button>
          <button *appHasPermission="'procurement.delete'" pButton type="button" icon="pi pi-trash"
                  class="p-button-text p-button-sm p-button-danger" (click)="delete(v)"></button>
        </td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
      <tr><td colspan="6" class="empty-cell">No vendors yet.</td></tr>
    </ng-template>
  </p-table>
</div>

<p-dialog header="{{ editing ? 'Edit' : 'Add' }} Vendor" [(visible)]="showDialog" [modal]="true" [style]="{ width: '32rem' }">
  <div class="form-grid">
    <label>
      <span>Name</span>
      <input pInputText [(ngModel)]="form.name" />
    </label>
    <label>
      <span>Category</span>
      <input pInputText [(ngModel)]="form.category" placeholder="e.g. Raw Materials" />
    </label>
    <label>
      <span>Contact Email</span>
      <input pInputText [(ngModel)]="form.contactEmail" />
    </label>
    <label>
      <span>Contact Phone</span>
      <input pInputText [(ngModel)]="form.contactPhone" />
    </label>
    <label>
      <span>Address</span>
      <input pInputText [(ngModel)]="form.address" />
    </label>
    <label>
      <span>Owner</span>
      <p-dropdown [options]="users" [(ngModel)]="form.ownerId" optionLabel="name" optionValue="id"
                  placeholder="Select owner" [style]="{ width: '100%' }"></p-dropdown>
    </label>
    <label class="checkbox-row">
      <p-checkbox [(ngModel)]="form.isActive" [binary]="true"></p-checkbox>
      <span>Active</span>
    </label>
  </div>
  <ng-template pTemplate="footer">
    <button pButton type="button" label="Cancel" class="p-button-text" (click)="showDialog = false"></button>
    <button pButton type="button" label="Save" [loading]="saving" (click)="save()"></button>
  </ng-template>
</p-dialog>
