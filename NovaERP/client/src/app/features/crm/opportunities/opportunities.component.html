<p-toast></p-toast>
<p-confirmDialog></p-confirmDialog>

<div class="page-header">
  <h1>Opportunities</h1>
  <button *appHasPermission="'crm.create'" pButton type="button" icon="pi pi-plus" label="Add Opportunity"
          (click)="openNew()"></button>
</div>

<div class="card">
  <p-table [value]="opportunities" [loading]="loading" dataKey="id" responsiveLayout="scroll">
    <ng-template pTemplate="header">
      <tr>
        <th>Name</th>
        <th>Account</th>
        <th>Amount</th>
        <th>Stage</th>
        <th>Close Date</th>
        <th>Owner</th>
        <th style="width: 10rem">Actions</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-o>
      <tr>
        <td class="font-semibold">{{ o.name }}</td>
        <td>{{ o.accountName }}</td>
        <td>{{ o.amount | number: '1.2-2' }}</td>
        <td><p-tag [severity]="stageSeverity(o.stage)" [value]="o.stage"></p-tag></td>
        <td>{{ o.closeDate ? (o.closeDate | date: 'mediumDate') : '—' }}</td>
        <td>{{ o.ownerName }}</td>
        <td class="actions-cell">
          <button *appHasPermission="'crm.edit'" pButton type="button" icon="pi pi-pencil"
                  class="p-button-text p-button-sm" (click)="openEdit(o)"></button>
          <button *appHasPermission="'crm.delete'" pButton type="button" icon="pi pi-trash"
                  class="p-button-text p-button-sm p-button-danger" (click)="delete(o)"></button>
        </td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
      <tr><td colspan="7" class="empty-cell">No opportunities yet.</td></tr>
    </ng-template>
  </p-table>
</div>

<p-dialog header="{{ editing ? 'Edit' : 'Add' }} Opportunity" [(visible)]="showDialog" [modal]="true" [style]="{ width: '32rem' }">
  <div class="form-grid">
    <label>
      <span>Account</span>
      <p-dropdown [options]="accounts" [(ngModel)]="form.accountId" optionLabel="name" optionValue="id"
                  placeholder="Select account" [disabled]="!!editing" [style]="{ width: '100%' }"></p-dropdown>
    </label>
    <label>
      <span>Name</span>
      <input pInputText [(ngModel)]="form.name" />
    </label>
    <label>
      <span>Amount</span>
      <p-inputNumber [(ngModel)]="form.amount" mode="decimal" [minFractionDigits]="2" [style]="{ width: '100%' }"></p-inputNumber>
    </label>
    <label>
      <span>Stage</span>
      <p-dropdown [options]="stages" [(ngModel)]="form.stage" [style]="{ width: '100%' }"></p-dropdown>
    </label>
    <label>
      <span>Close Date</span>
      <p-calendar [(ngModel)]="form.closeDate" dateFormat="dd/mm/yy" [showIcon]="true" [style]="{ width: '100%' }"></p-calendar>
    </label>
    <label>
      <span>Owner</span>
      <p-dropdown [options]="users" [(ngModel)]="form.ownerId" optionLabel="name" optionValue="id"
                  placeholder="Select owner" [style]="{ width: '100%' }"></p-dropdown>
    </label>
  </div>
  <ng-template pTemplate="footer">
    <button pButton type="button" label="Cancel" class="p-button-text" (click)="showDialog = false"></button>
    <button pButton type="button" label="Save" [loading]="saving" (click)="save()"></button>
  </ng-template>
</p-dialog>
