<p-toast></p-toast>
<p-confirmDialog></p-confirmDialog>

<div class="page-header">
  <h1>Contacts</h1>
  <button *appHasPermission="'crm.create'" pButton type="button" icon="pi pi-plus" label="Add Contact"
          (click)="openNew()"></button>
</div>

<div class="card">
  <p-table [value]="contacts" [loading]="loading" dataKey="id" responsiveLayout="scroll">
    <ng-template pTemplate="header">
      <tr>
        <th>Name</th>
        <th>Title</th>
        <th>Account</th>
        <th>Email</th>
        <th>Owner</th>
        <th style="width: 10rem">Actions</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-c>
      <tr>
        <td class="font-semibold">{{ c.firstName }} {{ c.lastName }}</td>
        <td>{{ c.title || '—' }}</td>
        <td>{{ c.accountName || '—' }}</td>
        <td>{{ c.email || '—' }}</td>
        <td>{{ c.ownerName }}</td>
        <td class="actions-cell">
          <button *appHasPermission="'crm.edit'" pButton type="button" icon="pi pi-pencil"
                  class="p-button-text p-button-sm" (click)="openEdit(c)"></button>
          <button *appHasPermission="'crm.delete'" pButton type="button" icon="pi pi-trash"
                  class="p-button-text p-button-sm p-button-danger" (click)="delete(c)"></button>
        </td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
      <tr><td colspan="6" class="empty-cell">No contacts yet.</td></tr>
    </ng-template>
  </p-table>
</div>

<p-dialog header="{{ editing ? 'Edit' : 'Add' }} Contact" [(visible)]="showDialog" [modal]="true" [style]="{ width: '32rem' }">
  <div class="form-grid">
    <label>
      <span>First Name</span>
      <input pInputText [(ngModel)]="form.firstName" />
    </label>
    <label>
      <span>Last Name</span>
      <input pInputText [(ngModel)]="form.lastName" />
    </label>
    <label>
      <span>Title</span>
      <input pInputText [(ngModel)]="form.title" placeholder="e.g. Procurement Manager" />
    </label>
    <label>
      <span>Account</span>
      <p-dropdown [options]="accounts" [(ngModel)]="form.accountId" optionLabel="name" optionValue="id"
                  placeholder="Optional" [showClear]="true" [style]="{ width: '100%' }"></p-dropdown>
    </label>
    <label>
      <span>Email</span>
      <input pInputText [(ngModel)]="form.email" />
    </label>
    <label>
      <span>Phone</span>
      <input pInputText [(ngModel)]="form.phone" />
    </label>
    <label>
      <span>Owner</span>
      <p-dropdown [options]="users" [(ngModel)]="form.ownerId" optionLabel="name" optionValue="id"
                  placeholder="Select owner" [style]="{ width: '100%' }"></p-dropdown>
    </label>
  </div>
  <ng-template pTemplate="footer">
    <button pButton type="button" label="Cancel" class="p-button-text" (click)="showDialog = false"></button>
    <button pButton type="button" label="Save" [loading]="saving" (click)="save()"></button>
  </ng-template>
</p-dialog>
