<p-toast></p-toast>
<p-confirmDialog></p-confirmDialog>

<div class="page-header">
  <h1>Leave Requests</h1>
  <button *appHasPermission="'hrms.create'" pButton type="button" icon="pi pi-plus" label="New Leave Request"
          (click)="openNew()"></button>
</div>

<div class="card">
  <p-table [value]="leaveRequests" [loading]="loading" dataKey="id" responsiveLayout="scroll">
    <ng-template pTemplate="header">
      <tr>
        <th>Employee</th>
        <th>Leave Type</th>
        <th>Start</th>
        <th>End</th>
        <th>Days</th>
        <th>Status</th>
        <th style="width: 16rem">Actions</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-r>
      <tr>
        <td class="font-semibold">{{ r.employeeName }}</td>
        <td>{{ r.leaveTypeName }}</td>
        <td>{{ r.startDate | date: 'mediumDate' }}</td>
        <td>{{ r.endDate | date: 'mediumDate' }}</td>
        <td>{{ r.daysRequested | number: '1.0-2' }}</td>
        <td><p-tag [severity]="statusSeverity(r.status)" [value]="r.status"></p-tag></td>
        <td class="actions-cell">
          @if (r.status === 'Pending') {
            <button *appHasPermission="'hrms.edit'" pButton type="button" icon="pi pi-check" label="Approve"
                    class="p-button-text p-button-sm p-button-success" (click)="approve(r)"></button>
            <button *appHasPermission="'hrms.edit'" pButton type="button" icon="pi pi-times" label="Reject"
                    class="p-button-text p-button-sm p-button-danger" (click)="reject(r)"></button>
            <button *appHasPermission="'hrms.edit'" pButton type="button" icon="pi pi-pencil"
                    class="p-button-text p-button-sm" (click)="openEdit(r)"></button>
            <button *appHasPermission="'hrms.edit'" pButton type="button" icon="pi pi-ban" label="Cancel"
                    class="p-button-text p-button-sm" (click)="cancel(r)"></button>
            <button *appHasPermission="'hrms.delete'" pButton type="button" icon="pi pi-trash"
                    class="p-button-text p-button-sm p-button-danger" (click)="delete(r)"></button>
          }
        </td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
      <tr><td colspan="7" class="empty-cell">No leave requests yet.</td></tr>
    </ng-template>
  </p-table>
</div>

<p-dialog header="{{ editing ? 'Edit' : 'New' }} Leave Request" [(visible)]="showDialog" [modal]="true" [style]="{ width: '32rem' }">
  <div class="form-grid">
    <label>
      <span>Employee</span>
      <p-dropdown [options]="employees" [(ngModel)]="form.employeeId" optionValue="id"
                  placeholder="Select employee" [disabled]="!!editing" [style]="{ width: '100%' }">
        <ng-template let-e pTemplate="item">{{ e.firstName }} {{ e.lastName }}</ng-template>
        <ng-template let-e pTemplate="selectedItem">{{ e.firstName }} {{ e.lastName }}</ng-template>
      </p-dropdown>
    </label>
    <label>
      <span>Leave Type</span>
      <p-dropdown [options]="leaveTypes" [(ngModel)]="form.leaveTypeId" optionLabel="name" optionValue="id"
                  placeholder="Select leave type" [style]="{ width: '100%' }"></p-dropdown>
    </label>
    <label>
      <span>Start Date</span>
      <p-calendar [(ngModel)]="form.startDate" dateFormat="dd/mm/yy" [showIcon]="true" [style]="{ width: '100%' }"></p-calendar>
    </label>
    <label>
      <span>End Date</span>
      <p-calendar [(ngModel)]="form.endDate" dateFormat="dd/mm/yy" [showIcon]="true" [style]="{ width: '100%' }"></p-calendar>
    </label>
    <label>
      <span>Days Requested</span>
      <p-inputNumber [(ngModel)]="form.daysRequested" mode="decimal" [minFractionDigits]="0" [maxFractionDigits]="2" [style]="{ width: '100%' }"></p-inputNumber>
    </label>
    <label>
      <span>Reason</span>
      <input pInputText [(ngModel)]="form.reason" />
    </label>
  </div>
  <ng-template pTemplate="footer">
    <button pButton type="button" label="Cancel" class="p-button-text" (click)="showDialog = false"></button>
    <button pButton type="button" label="Save" [loading]="saving" (click)="save()"></button>
  </ng-template>
</p-dialog>
