<p-toast></p-toast>
<p-confirmDialog></p-confirmDialog>

<div class="page-header">
  <h1>Leave Types</h1>
  <button *appHasPermission="'hrms.create'" pButton type="button" icon="pi pi-plus" label="Add Leave Type"
          (click)="openNew()"></button>
</div>

<div class="card">
  <p-table [value]="leaveTypes" [loading]="loading" dataKey="id" responsiveLayout="scroll">
    <ng-template pTemplate="header">
      <tr>
        <th>Code</th>
        <th>Name</th>
        <th>Default Days/Year</th>
        <th>Active</th>
        <th style="width: 10rem">Actions</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-t>
      <tr>
        <td><code class="code-badge">{{ t.code }}</code></td>
        <td class="font-semibold">{{ t.name }}</td>
        <td>{{ t.defaultDaysPerYear ?? '—' }}</td>
        <td>
          <p-tag [severity]="t.isActive ? 'success' : 'danger'" [value]="t.isActive ? 'Active' : 'Inactive'"></p-tag>
        </td>
        <td class="actions-cell">
          <button *appHasPermission="'hrms.edit'" pButton type="button" icon="pi pi-pencil"
                  class="p-button-text p-button-sm" (click)="openEdit(t)"></button>
          <button *appHasPermission="'hrms.delete'" pButton type="button" icon="pi pi-trash"
                  class="p-button-text p-button-sm p-button-danger" (click)="delete(t)"></button>
        </td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
      <tr><td colspan="5" class="empty-cell">No leave types yet.</td></tr>
    </ng-template>
  </p-table>
</div>

<p-dialog header="{{ editing ? 'Edit' : 'Add' }} Leave Type" [(visible)]="showDialog" [modal]="true" [style]="{ width: '28rem' }">
  <div class="form-grid">
    <label>
      <span>Code</span>
      <input pInputText [(ngModel)]="form.code" [disabled]="!!editing" placeholder="e.g. ANNUAL" />
    </label>
    <label>
      <span>Name</span>
      <input pInputText [(ngModel)]="form.name" />
    </label>
    <label>
      <span>Default Days/Year</span>
      <p-inputNumber [(ngModel)]="form.defaultDaysPerYear" mode="decimal" [minFractionDigits]="0" [maxFractionDigits]="2" [style]="{ width: '100%' }"></p-inputNumber>
    </label>
    <label class="checkbox-row">
      <p-checkbox [(ngModel)]="form.isActive" [binary]="true"></p-checkbox>
      <span>Active</span>
    </label>
  </div>
  <ng-template pTemplate="footer">
    <button pButton type="button" label="Cancel" class="p-button-text" (click)="showDialog = false"></button>
    <button pButton type="button" label="Save" [loading]="saving" (click)="save()"></button>
  </ng-template>
</p-dialog>
