<p-toast></p-toast>
<p-confirmDialog></p-confirmDialog>

<div class="page-header">
  <h1>Documents</h1>
</div>

<div class="card">
  <div class="upload-row" *appHasPermission="'documents.create'">
    <p-fileUpload #fileUpload mode="basic" name="file" chooseLabel="Upload Document"
                  [customUpload]="true" [auto]="true" [disabled]="uploading"
                  (uploadHandler)="onUpload($event, fileUpload)"></p-fileUpload>
  </div>

  <p-table [value]="documents" [loading]="loading" dataKey="id" responsiveLayout="scroll">
    <ng-template pTemplate="header">
      <tr>
        <th>File Name</th>
        <th>Type</th>
        <th>Size</th>
        <th>Uploaded</th>
        <th style="width: 8rem">Actions</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-d>
      <tr>
        <td class="font-semibold">{{ d.fileName }}</td>
        <td>{{ d.contentType }}</td>
        <td>{{ formatSize(d.sizeBytes) }}</td>
        <td>{{ d.uploadedDate | date: 'medium' }}</td>
        <td class="actions-cell">
          <button *appHasPermission="'documents.view'" pButton type="button" icon="pi pi-download"
                  class="p-button-text p-button-sm" (click)="download(d)"></button>
          <button *appHasPermission="'documents.delete'" pButton type="button" icon="pi pi-trash"
                  class="p-button-text p-button-sm p-button-danger" (click)="delete(d)"></button>
        </td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
      <tr><td colspan="5" class="empty-cell">No documents uploaded.</td></tr>
    </ng-template>
  </p-table>
</div>
