<p-toast></p-toast>

<div class="page-header">
  <h1>Feature Toggles</h1>
</div>

<div class="card">
  <h2 class="section-title">Active modules</h2>
  <p-table [value]="activeModules" [loading]="loading" dataKey="id" responsiveLayout="scroll">
    <ng-template pTemplate="header">
      <tr>
        <th>Module</th>
        <th style="width: 8rem">Enabled</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-row>
      <tr>
        <td class="font-semibold">{{ row.moduleKey }}</td>
        <td>
          <p-toggleswitch [ngModel]="row.isEnabled" (ngModelChange)="toggle(row, $event)"
                           [disabled]="savingKey === row.moduleKey"
                           *appHasPermission="'settings.edit'"></p-toggleswitch>
        </td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
      <tr><td colspan="2" class="empty-cell">No active modules.</td></tr>
    </ng-template>
  </p-table>

  <h2 class="section-title mt-6">Coming soon</h2>
  <p-table [value]="inactiveModules" [loading]="loading" dataKey="id" responsiveLayout="scroll">
    <ng-template pTemplate="header">
      <tr>
        <th>Module</th>
        <th style="width: 8rem">Enabled</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-row>
      <tr>
        <td>{{ row.moduleKey }}</td>
        <td>
          <p-toggleswitch [ngModel]="row.isEnabled" (ngModelChange)="toggle(row, $event)"
                           [disabled]="savingKey === row.moduleKey"
                           *appHasPermission="'settings.edit'"></p-toggleswitch>
        </td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
      <tr><td colspan="2" class="empty-cell">All modules are active.</td></tr>
    </ng-template>
  </p-table>
</div>
